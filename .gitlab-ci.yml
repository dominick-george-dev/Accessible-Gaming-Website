stages:
  - test

variables:
  NODE_ENV: test
  SUBDIR: "group-6-accessibility-project"
  BACKEND_DIR: "$CI_PROJECT_DIR/$SUBDIR/backend"
  FRONTEND_DIR: "$CI_PROJECT_DIR/$SUBDIR/frontend"

cache:
  key: ${CI_PROJECT_PATH}
  paths:
    - $BACKEND_DIR/node_modules
    - $FRONTEND_DIR/node_modules

test:backend:
  image: node:20-alpine
  stage: test
  before_script:
    - cd "$BACKEND_DIR" || cd "$SUBDIR/backend"
    - npm ci
  script:
    # run unit tests (uses "test" script in backend/package.json)
    - npm run test -- --coverage
  artifacts:
    when: always
    paths:
      - $BACKEND_DIR/coverage
    expire_in: 1 week
  only:
    - branches