<!DOCTYPE html>
<html>
<head>
    <title>Test Accessibility Settings API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .setting { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 5px 10px; margin: 5px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Accessibility Settings API</h1>
        <div id="status" class="status loading">Loading current settings...</div>
        
        <div class="setting">
            <h3>Text Size</h3>
            <span id="current-text-size">Loading...</span>
            <br>
            <button onclick="updateTextSize('small')">Small</button>
            <button onclick="updateTextSize('medium')">Medium</button>
            <button onclick="updateTextSize('large')">Large</button>
            <button onclick="updateTextSize('extra-large')">Extra Large</button>
        </div>

        <div class="setting">
            <h3>Dark Mode</h3>
            <span id="current-dark-mode">Loading...</span>
            <br>
            <button onclick="toggleDarkMode(true)">Enable Dark Mode</button>
            <button onclick="toggleDarkMode(false)">Disable Dark Mode</button>
        </div>

        <div class="setting">
            <h3>High Contrast</h3>
            <span id="current-high-contrast">Loading...</span>
            <br>
            <button onclick="toggleHighContrast(true)">Enable High Contrast</button>
            <button onclick="toggleHighContrast(false)">Disable High Contrast</button>
        </div>

        <div class="setting">
            <h3>Text to Speech</h3>
            <span id="current-text-to-speech">Loading...</span>
            <br>
            <button onclick="toggleTextToSpeech(true)">Enable Text to Speech</button>
            <button onclick="toggleTextToSpeech(false)">Disable Text to Speech</button>
        </div>

        <div class="setting">
            <button onclick="loadCurrentSettings()" style="background: #007bff; color: white;">🔄 Refresh Current Settings</button>
            <button onclick="openPrismaStudio()" style="background: #28a745; color: white;">📊 Open Database View</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000';
        const USER_ID = 1;

        async function loadCurrentSettings() {
            try {
                document.getElementById('status').textContent = 'Loading settings...';
                document.getElementById('status').className = 'status loading';

                const response = await fetch(`${API_BASE_URL}/user-accessibility-settings/${USER_ID}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const settings = await response.json();
                
                // Update displays
                document.getElementById('current-text-size').textContent = `Current: ${settings.textSize}`;
                document.getElementById('current-dark-mode').textContent = `Current: ${settings.darkMode ? 'Enabled' : 'Disabled'}`;
                document.getElementById('current-high-contrast').textContent = `Current: ${settings.highContrast ? 'Enabled' : 'Disabled'}`;
                document.getElementById('current-text-to-speech').textContent = `Current: ${settings.textToSpeech ? 'Enabled' : 'Disabled'}`;
                
                document.getElementById('status').textContent = `✅ Settings loaded successfully! Last updated: ${new Date(settings.updatedAt).toLocaleString()}`;
                document.getElementById('status').className = 'status success';
                
            } catch (error) {
                console.error('Error loading settings:', error);
                document.getElementById('status').textContent = `❌ Error: ${error.message}`;
                document.getElementById('status').className = 'status error';
            }
        }

        async function updateSetting(settingName, value) {
            try {
                document.getElementById('status').textContent = `Updating ${settingName}...`;
                document.getElementById('status').className = 'status loading';

                const response = await fetch(`${API_BASE_URL}/user-accessibility-settings/${USER_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ [settingName]: value }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const updatedSettings = await response.json();
                
                document.getElementById('status').textContent = `✅ ${settingName} updated to: ${value}`;
                document.getElementById('status').className = 'status success';
                
                // Refresh the current settings display
                setTimeout(() => loadCurrentSettings(), 1000);
                
            } catch (error) {
                console.error('Error updating setting:', error);
                document.getElementById('status').textContent = `❌ Error updating ${settingName}: ${error.message}`;
                document.getElementById('status').className = 'status error';
            }
        }

        // Individual setting functions
        async function updateTextSize(size) {
            await updateSetting('textSize', size);
        }

        async function toggleDarkMode(enabled) {
            await updateSetting('darkMode', enabled);
        }

        async function toggleHighContrast(enabled) {
            await updateSetting('highContrast', enabled);
        }

        async function toggleTextToSpeech(enabled) {
            await updateSetting('textToSpeech', enabled);
        }

        function openPrismaStudio() {
            alert('To open Prisma Studio for real-time database viewing:\\n\\n1. Open a new terminal\\n2. cd to your backend folder\\n3. Run: npx prisma studio\\n4. It will open in your browser at http://localhost:5555');
        }

        // Load initial settings when page loads
        loadCurrentSettings();
    </script>
</body>
</html>
