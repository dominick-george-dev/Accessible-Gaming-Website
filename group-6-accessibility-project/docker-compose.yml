services:
  backend:
    build: ./backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${AWS_REGION}"
      AWS_S3_BUCKET_NAME: "${AWS_S3_BUCKET_NAME}"
      CLOUDFRONT_URL: "${CLOUDFRONT_URL}"
      NODE_ENV: production  # Add this for production mode
    ports:
      - "8080:3000"

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    environment:
      frontend:
        build:
          context: ./frontend
          args:
            - VITE_API_URL=http://${FLOATING_IP}:8080   # passed at build time
        restart: always
        ports:
          - "8081:80"
        depends_on:
          - backend
        environment:
          - VITE_API_URL=http://${FLOATING_IP}:8080   # also available at runtime if needed
        env_file:
          - .env

volumes:
  postgres_data: