services:
  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${AWS_REGION}"
      S3_BUCKET_NAME: "${S3_BUCKET_NAME}"
      CLOUDFRONT_URL: "${CLOUDFRONT_URL}"
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  jenkins:
    build: ./jenkins
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data: