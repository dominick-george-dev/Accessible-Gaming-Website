services:
  backend:
    build: ./backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${AWS_REGION}"
      AWS_S3_BUCKET_NAME: "${AWS_S3_BUCKET_NAME}"
      CLOUDFRONT_URL: "${CLOUDFRONT_URL}"
      NODE_ENV: production
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://10.72.97.219:3000
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    env_file:
      - .env

volumes:
  postgres_data: